<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=Edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- CSS Reset -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">

	<!-- Milligram CSS -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.css">

	<link href="./css/style.css" rel="stylesheet">

	<link href="https://cdn.jsdelivr.net/npm/quill@2.0.0-rc.5/dist/quill.snow.css" rel="stylesheet" />

	<title>CD para Correo Argentino</title>
	<style>
		.ql-snow {max-width: 100%;}
				
		
	</style>
</head>

<body>
	<header></header>
	<div class="container" style="max-width: 67%;margin: 5rem auto 15rem;">
		<div class="column">
			<label>Datos Remitente:</label>
			<div>
				<div class="row">
					<div class="column column-50">
						<input type="text" id="name_rt" placeholder="Nombre y Apellido">
					</div>
					<div class="column column-50">
						<input type="text" id="address_rt" placeholder="Dirección">
					</div>
				</div>
				<div class="row">
					<div class="column column-25">
						<input type="text" id="cp_rt" placeholder="Cod. Postal">
					</div>
					<div class="column column-37">
						<input type="text" id="city_rt" placeholder="Localidad">
					</div>
					<div class="column column-37">
						<input type="text" id="state_rt" placeholder="Provincia">
					</div>
				</div>
			</div>
			<label>Datos Destinatario:</label>
			<div>
				<div class="row">
					<div class="column column-50">
						<input type="text" id="name_dt" placeholder="Nombre y Apellido">
					</div>
					<div class="column column-50">
						<input type="text" id="address_dt" placeholder="Dirección">
					</div>
				</div>
				<div class="row">
					<div class="column column-25">
						<input type="text" id="cp_dt" placeholder="Cod. Postal">
					</div>
					<div class="column column-37">
						<input type="text" id="city_dt" placeholder="Localidad">
					</div>
					<div class="column column-37">
						<input type="text" id="state_dt" placeholder="Provincia">
					</div>
				</div>
			</div>
			<label>Cuerpo de la Carta:</label>
			<div id="editor" style="width:100%;max-height:500px;height:500px;font-family: Arial, Helvetica, sans-serif;border-radius: 0 0 0.4rem 0.4rem;">


			</div>

			<label>Para la firma:</label>
			<div>
				<div class="row">
					<div class="column column-50">
						<input type="text" id="sing_name" placeholder="Nombre y Apellido">
					</div>
					<div class="column column-50">
						<input type="text" id="sing_dni" placeholder="DNI">
					</div>
				</div>
			</div>
         <details style="margin:1rem 0 1.2rem 0;cursor: pointer;">
            <summary id="sum">Conf. Avanzada:</summary>
            <div>
				<div class="row">
					<div class="column column-30">
						<label for="margin_left">Margen Izquierdo(cm):</label>
						<input type="number" id="margin_left" step="0.01" inputmode="numeric" value="0.60">
					</div>
					<div class="column column-30">
						<label for="margin_top">Margen Superior(cm):</label>
						<input type="number" id="margin_top" step="0.01" inputmode="numeric" value="2.56">
					</div>

					<div class="column column-30" style="position: relative;">
						<input class="button button-clear" type="submit" id="res_margin" value="Restablecer" style="position: absolute; bottom: 1rem;">
					</div>
				</div>
			</div>
            </details>  
			
			
			<div class="float-center">
				<a class="button button-large" href="template-correo-arg.html" target="iFrame" id="send_data">IMPRIMIR CD</a>

			</div>

		</div>
	</div>
	</div>
	<iframe id="iFrame" name="iFrame" style="display:none"></iframe>
	<script src="./scripts/script.js"></script>
	<script src="./scripts/content.js"></script>
	<!-- Include the Quill library -->
	<script src="https://cdn.jsdelivr.net/npm/quill@2.0.0-rc.5/dist/quill.js"></script>

	<!-- Initialize Quill editor -->
	<script>
		const toolbarOptions = [
				  ['bold', 'italic', 'underline', 'strike'],        // toggled buttons
				  [{ 'size': ['small', false, 'large', 'huge'] }],  // custom dropdown
				  [{ 'align': [] }]
				];
				
				const quill = new Quill('#editor', {
				  modules: {
				    toolbar: toolbarOptions
				  },
				  theme: 'snow'
				});
				
		
	</script>
</body>
</html>
